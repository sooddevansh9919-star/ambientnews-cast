<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ambient News Cast</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f5f8fb;background:#030a14}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030a14}
body{background:linear-gradient(135deg,#030a14,#081d30 55%,#030912);}
#app{width:100%;height:100%;display:flex;flex-direction:column;padding:28px 42px 30px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:38px;font-weight:800;letter-spacing:.5px}.sub{font-size:15px;color:#6ebeff;margin-top:2px;letter-spacing:1.4px}
.clock{text-align:right;font-size:25px;font-weight:700;white-space:nowrap}.location,.weather{font-size:15px;color:#a0c3e1;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{flex:1;min-height:0;margin-top:18px;padding:28px;border-radius:24px;background:#0a1927;display:flex;flex-direction:column;overflow:hidden}
.meta{font-size:15px;font-weight:700;color:#5abfff;letter-spacing:.4px}.title{font-size:32px;line-height:1.14;font-weight:800;margin:10px 0 16px}
.media{width:100%;height:min(38vh,390px);display:flex;align-items:center;justify-content:center;background:#142330;border-radius:15px;overflow:hidden;flex:none}
.media img{width:100%;height:100%;object-fit:contain;display:block}.media.hidden{display:none}
.story-wrap{margin-top:14px;min-height:0;flex:1;overflow:hidden;position:relative}.story{font-size:22px;line-height:1.48;color:#dce1e8;white-space:pre-wrap;padding-right:12px;will-change:transform}
.story-spacer{height:8px}.source{font-size:13px;color:#6e91aa;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#status{position:fixed;left:42px;bottom:12px;font-size:12px;color:#6e91aa;opacity:.7}
</style>
</head>
<body>
<div id="app">
<header><div><div class="brand">AMBIENT</div><div class="sub">AUTONOMOUS CONTENT • CAST</div><div id="location" class="location">LOCATION • —</div><div id="weather" class="weather">WEATHER • —</div></div><div id="clock" class="clock">12:00 PM</div></header>
<section class="card">
<div id="meta" class="meta">WAITING FOR PHONE</div>
<div id="title" class="title">Connect Ambient News from your phone.</div>
<div id="media" class="media hidden"><img id="image" alt=""></div>
<div class="story-wrap"><div id="story" class="story"></div></div>
<div id="source" class="source"></div>
</section>
</div>
<div id="status">CAST RECEIVER READY</div>
<script>
const NAMESPACE='urn:x-cast:com.ambientnews.cards';
const receiver=cast.framework.CastReceiverContext.getInstance();
let state={cards:[],index:0,remaining:30000,duration:30000,sentAt:0};
let timer=null,scrollToken=0;
const $=id=>document.getElementById(id);
function escText(v){return v==null?'':String(v)}
function updateClock(){ $('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
setInterval(updateClock,1000); updateClock();
function stopScroll(){scrollToken++;$('story').style.transform='translateY(0px)';}
function render(card, initialElapsedMs=0){
  stopScroll();
  if(!card) return;
  $('meta').textContent=escText(card.tag)+'   •   '+(state.index+1)+' / '+state.cards.length;
  $('title').textContent=escText(card.title)||'Untitled';
  $('location').textContent='LOCATION • '+escText(state.location||'—')+(state.country?' • '+state.country:'');
  $('weather').textContent=escText(state.weather||'WEATHER • —');
  const visual=['ANIME','GAMING','WALLPAPERS'].includes(card.tag);
  const body=visual?'':escText(card.body).trim();
  const media=$('media'), img=$('image');
  if(card.image){media.classList.remove('hidden');img.src=card.image;img.onerror=()=>media.classList.add('hidden');}
  else media.classList.add('hidden');
  $('story').textContent=body;
  $('source').textContent=escText(card.tag)+'  •  '+(state.index+1)+'/'+state.cards.length+'  •  '+Math.round(state.duration/1000)+' SEC';
  requestAnimationFrame(()=>startScroll(state.duration, Math.max(0, initialElapsedMs)));
}
function startScroll(slotMs, initialElapsedMs=0){
  const token=scrollToken; const wrap=document.querySelector('.story-wrap'); const story=$('story');
  if(!story.textContent.trim()) return;
  requestAnimationFrame(()=>{
    if(token!==scrollToken)return;
    const max=Math.max(0,story.scrollHeight-wrap.clientHeight);
    if(max<=8)return;
    const downMs=Math.max(5000,Math.min(20000,max*12));
    const upMs=Math.max(3500,Math.min(12000,max*9));
    const pause=2500;
    const start=performance.now()-Math.max(0,initialElapsedMs);
    function frame(now){
      if(token!==scrollToken)return;
      const elapsed=now-start;
      let y=0;
      if(elapsed<=pause)y=0;
      else if(elapsed<=pause+downMs)y=max*((elapsed-pause)/downMs);
      else if(elapsed<=pause+downMs+pause)y=max;
      else if(elapsed<=pause+downMs+pause+upMs)y=max*(1-(elapsed-pause-downMs-pause)/upMs);
      else { requestAnimationFrame(frame); return; }
      story.style.transform='translateY('+(-y)+'px)';
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
function schedule(){
  if(timer)clearTimeout(timer);
  if(!state.cards.length)return;
  // Never invent a new category/batch on the receiver. The phone owns the
  // playlist and will send the next batch when its fetch completes.
  if(state.index>=state.cards.length-1){
    $('status').textContent='SYNC • WAITING FOR NEXT BATCH';
    return;
  }
  const delay=Math.max(250,state.remaining||state.duration||30000);
  timer=setTimeout(()=>{
    if(!state.cards.length)return;
    state.index++;
    state.remaining=state.duration;
    render(state.cards[state.index],0);
    schedule();
  },delay);
}
receiver.addCustomMessageListener(NAMESPACE,event=>{
  try{
    const p=typeof event.data==='string'?JSON.parse(event.data):event.data;
    if(!p||p.type!=='cards'||!Array.isArray(p.cards))return;
    state={...state,...p};
    state.cards=p.cards; state.index=Math.max(0,Math.min(Number(p.start)||0,state.cards.length-1));
    state.remaining=Math.max(250,Number(p.interval)||Number(p.duration)||30000);
    state.duration=Math.max(1000,Number(p.duration)||state.remaining||30000);
    state.sentAt=Number(p.sentAt)||Date.now();
    const elapsed=Math.max(0, state.duration-state.remaining);
    $('status').textContent='SYNC • '+state.index+'/'+state.cards.length+' • '+Math.round(state.remaining/1000)+' SEC';
    render(state.cards[state.index],elapsed);
    schedule();
  }catch(e){$('status').textContent='CAST MESSAGE ERROR';}
});
receiver.start();
</script>
</body>
</html>
